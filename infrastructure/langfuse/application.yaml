apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: homelab
  sources:
    - repoURL: https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      targetRevision: "*"
      helm:
        releaseName: langfuse
        valueFiles:
          - $values/infrastructure/langfuse/values.yaml
    - repoURL: https://github.com/rexdivakar/homelab-gitops.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/rexdivakar/homelab-gitops.git
      targetRevision: HEAD
      path: infrastructure/langfuse
      directory:
        include: langfuse-tailscale-ingress.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
