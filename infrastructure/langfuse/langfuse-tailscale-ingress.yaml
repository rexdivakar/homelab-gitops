apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse-tailscale
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - langfuse
  rules:
    - host: langfuse
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 3000
