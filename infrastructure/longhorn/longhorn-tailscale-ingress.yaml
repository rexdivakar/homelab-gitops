apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-tailscale
  namespace: longhorn-system
  annotations:
    # Tailscale Ingress terminates HTTPS and forwards HTTP to Longhorn.
    # Final private URL:
    # https://longhorn.laperm-dragon.ts.net
    argocd.argoproj.io/sync-wave: "30"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - longhorn
  rules:
    - host: longhorn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
