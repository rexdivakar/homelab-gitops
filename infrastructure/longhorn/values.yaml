# Longhorn is much stronger on three or more nodes because replicas can be
# distributed across machines. For a single-node homelab, one replica is
# acceptable for testing and local workloads, but it is not a backup strategy.

persistence:
  defaultClass: true
  defaultClassReplicaCount: 1

defaultSettings:
  # Single-node cluster: keep volume replicas at one so volumes can schedule.
  defaultReplicaCount: 1
  # Leave backups disabled until you configure an explicit NFS/S3 backup target.
  backupTarget: ""
  # Default Longhorn data path on the Kubernetes node.
  defaultDataPath: /var/lib/longhorn
  # Avoid strict anti-affinity requirements that do not fit a one-node cluster.
  replicaSoftAntiAffinity: true
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 10

service:
  ui:
    # Keep the Longhorn UI private inside the cluster. Add a Tailscale Ingress
    # later only if you explicitly want private tailnet access to the UI.
    type: ClusterIP

ingress:
  # Longhorn is not exposed by default.
  enabled: false
