apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-tailscale
  namespace: headlamp
  annotations:
    # Tailscale Ingress terminates HTTPS and forwards HTTP to Headlamp.
    # Final private URL:
    # https://headlamp.laperm-dragon.ts.net
    argocd.argoproj.io/sync-wave: "30"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - headlamp
  rules:
    - host: headlamp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
