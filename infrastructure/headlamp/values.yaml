# Headlamp provides a Kubernetes web UI. It is exposed only through private
# Tailscale Ingress in this repo.

replicaCount: 1

config:
  inCluster: true
  # Direct tailnet access: users reaching Headlamp are authenticated as this
  # release's service account. Keep the URL private to the tailnet.
  unsafeUseServiceAccountToken: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin

persistentVolumeClaim:
  enabled: false

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
