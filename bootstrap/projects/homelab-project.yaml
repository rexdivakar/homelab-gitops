apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: Single-node homelab GitOps project
  sourceRepos:
    # Replace this placeholder with your real GitHub repository URL.
    - https://github.com/rexdivakar/homelab-gitops.git
    - https://charts.longhorn.io
    - https://prometheus-community.github.io/helm-charts
    - https://kubernetes-sigs.github.io/headlamp/
    - https://charts.jetstack.io
    - https://cloudnative-pg.github.io/charts
    - https://helm.releases.hashicorp.com
    - https://charts.bitnami.com/bitnami
    - https://langfuse.github.io/langfuse-k8s
    - https://pkgs.tailscale.com/helmcharts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: keycloak
    - server: https://kubernetes.default.svc
      namespace: langfuse
    - server: https://kubernetes.default.svc
      namespace: popeye
    - server: https://kubernetes.default.svc
      namespace: longhorn-system
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: headlamp
    # kube-prometheus-stack creates Services and ServiceMonitors for Kubernetes
    # control-plane components in kube-system.
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: tailscale
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    # Helm charts such as Longhorn and kube-prometheus-stack install CRDs,
    # ClusterRoles, ClusterRoleBindings, and other cluster-scoped resources.
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
