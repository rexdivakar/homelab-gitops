apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: Single-node homelab GitOps project
  sourceRepos:
    # Replace this placeholder with your real GitHub repository URL.
    - https://github.com/YOUR_GITHUB_USER/homelab-gitops.git
    - https://charts.longhorn.io
    - https://prometheus-community.github.io/helm-charts
    - https://pkgs.tailscale.com/helmcharts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: longhorn-system
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: tailscale
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    # Helm charts such as Longhorn and kube-prometheus-stack install CRDs,
    # ClusterRoles, ClusterRoleBindings, and other cluster-scoped resources.
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
